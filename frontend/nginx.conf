server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # REST calls go to the backend container, so the browser only talks to one origin.
  location /api/ {
    proxy_pass http://backend:8087;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
  }

  # Hashed bundles can be cached forever; index.html must always be revalidated.
  location ~* \.(js|css|woff2?|ico|png|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
