services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: token_tracker
      POSTGRES_USER: ${DB_USER:-token_tracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-token_tracker}
    ports:
      # 5433 on the host, so it does not clash with a local PostgreSQL on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-token_tracker} -d token_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: src/main/docker/Dockerfile
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-token_tracker}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-token_tracker}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # Set these in a .env file next to this one (see .env.example)
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8087/management/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
