# Production: only Caddy is published (80/443, automatic Let's Encrypt HTTPS).
# Caddy -> frontend (nginx) -> /api -> backend -> postgres, all on the internal Docker network.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Every variable comes from .env next to this file (see .env.example). Missing required ones stop the startup.

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: token_tracker
      POSTGRES_USER: ${DB_USER:-token_tracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-token_tracker} -d token_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: src/main/docker/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-token_tracker}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN:?DOMAIN must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -base64 32)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8087/management/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    logging: *logging

  # Nightly pg_dump into ./backups (daily/weekly/monthly rotation), see deploy/backup/backup.sh.
  # Same PostgreSQL major version as the server, so pg_dump/pg_restore are compatible.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/entrypoint.sh"]
    environment:
      TZ: UTC
      PGHOST: postgres
      PGDATABASE: token_tracker
      PGUSER: ${DB_USER:-token_tracker}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      # 01:45 UTC: right after the daily collection (01:15), so the day's holder snapshot is included.
      BACKUP_CRON: ${BACKUP_CRON:-45 1 * * *}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
    volumes:
      - ./deploy/backup:/scripts:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Unhealthy when no backup succeeded in the last 26 hours
      test: ["CMD-SHELL", "find /backups/last-success -mmin -1560 | grep -q ."]
      interval: 5m
      timeout: 10s
      start_period: 2m
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep this volume, or Let's Encrypt rate limits may bite
      - caddy_config:/config
    depends_on:
      - frontend
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
